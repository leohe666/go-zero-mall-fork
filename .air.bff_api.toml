# .air.bff_api.toml - bff_api (BFF 聚合编排服务) 热加载配置
# 只监听 service/bff 目录，只编译 bff_api 一个二进制
# 配合 start-services.sh：tmp/bff_api 二进制变化时只重启 BFF
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/bff_api ./service/bff/api"
bin = ""
full_bin = "true"
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["data", "tmp", "vendor", ".git"]
include_dir = ["service/bff"]
log = "build-errors.bff_api.log"
# 防抖：文件变化后等待 500ms 再触发构建，避免保存时多次触发
delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

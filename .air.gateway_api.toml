# .air.gateway_api.toml - gateway_api (统一 BFF 网关) 热加载配置
# 只监听 service/gateway 目录，只编译 gateway_api 一个二进制
# 配合 start-services.sh：tmp/gateway_api 二进制变化时只重启网关
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/gateway_api ./service/gateway/api"
bin = ""
full_bin = "true"
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["data", "tmp", "vendor", ".git"]
include_dir = ["service/gateway"]
log = "build-errors.gateway_api.log"
# 防抖：文件变化后等待 500ms 再触发构建，避免保存时多次触发
delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

# .air.toml - go-zero 微服务热加载配置（默认 air 配置）
# 放在 code/ 根目录，air 监听 4 个 RPC + 统一网关目录（旧 API 服务已删除）
# 只负责监听文件变化并编译，运行由 start-services.sh 处理

root = "."
tmp_dir = "tmp"

[build]
# 编译 5 个服务到 tmp/（4 RPC + 统一网关）
cmd = "go build -o ./tmp/user_rpc ./service/user/rpc && go build -o ./tmp/product_rpc ./service/product/rpc && go build -o ./tmp/order_rpc ./service/order/rpc && go build -o ./tmp/pay_rpc ./service/pay/rpc && go build -o ./tmp/gateway_api ./service/gateway/api"
# bin 留空，full_bin 设为 true 且指向 true 命令（空操作），彻底禁用 air 的 runner
bin = ""
full_bin = "true"
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["data", "tmp", "vendor", ".git"]
include_dir = ["service/user/rpc", "service/product/rpc", "service/order/rpc", "service/pay/rpc", "service/gateway"]
log = "build-errors.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
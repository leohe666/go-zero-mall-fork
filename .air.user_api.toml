# .air.user_api.toml - user_api 热加载配置：只监听 service/user/api 目录，只编译 user_api 一个二进制
# 配合 start-services.sh：tmp/user_api 二进制变化时只重启 user_api 对应服务
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/user_api ./service/user/api"
bin = ""
full_bin = "true"
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["data", "tmp", "vendor", ".git"]
include_dir = ["service/user/api", "common"]
log = "build-errors.user_api.log"
# 防抖：文件变化后等待 500ms 再触发构建，避免保存时多次触发
delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

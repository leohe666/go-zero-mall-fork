Name: bff
Host: 0.0.0.0
Port: 8887

# JWT 签发与校验（login 签发、userinfo/aggregate 校验）
Auth:
  AccessSecret: u46ipHAzMD2I4CH4lyz0NxZzEWQ5jQ6n
  AccessExpire: 86400

# 下游 RPC 客户端（供 handler/logic 编排聚合）
UserRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: user.rpc

OrderRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: order.rpc

ProductRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: product.rpc

# Telemetry for distributed tracing
Telemetry:
  Name: bff.api
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

# Prometheus metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9087
  Path: /metrics

# Logging
Log:
  ServiceName: bff.api
  Mode: file
  Encoding: json
  Path: /var/log/golang
  Level: info
  TimeFormat: "2006-01-02T15:04:05.000Z07:00"

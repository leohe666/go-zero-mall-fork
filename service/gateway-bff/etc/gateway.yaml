Name: gateway-bff
Host: 0.0.0.0
Port: 8888

# Route configuration: each route forwards by path prefix to a backend service
Routes:
  # User service routes
  - Prefix: /api/user
    Target: http://user-api:8000
    Strip: true

  # Product service routes
  - Prefix: /api/product
    Target: http://product-api:8001
    Strip: true

  # Order service routes
  - Prefix: /api/order
    Target: http://order-api:8002
    Strip: true

  # Pay service routes
  - Prefix: /api/pay
    Target: http://pay-api:8003
    Strip: true

# Telemetry for distributed tracing
Telemetry:
  Name: gateway-bff
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

# Prometheus metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9088
  Path: /metrics

# Logging
Log:
  ServiceName: gateway-bff
  Mode: file
  Encoding: json
  Path: /var/log/golang
  Level: info
  TimeFormat: "2006-01-02T15:04:05.000Z07:00"
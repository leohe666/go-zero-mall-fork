# =============================================================================
# 统一网关：一个进程、一个端口 (8888)，所有业务 API 的唯一入口。
#
# 组成：
#   ① Upstreams：HTTP -> gRPC 纯透传（register / 订单 / 商品 / 支付 CRUD），
#      零业务代码，服务发现 + 负载均衡由 zrpc 客户端通过 etcd 完成；
#   ② Auth + 下游 RPC 客户端：login（签发 JWT）、userinfo / aggregate
#      （校验 JWT、多 RPC 聚合编排），由 handler/logic 承载业务逻辑。
#
# 注意：透传转发依赖下游 RPC 服务开启 reflection（各 rpc 服务已配置 Mode: dev）。
# =============================================================================
Name: gateway
Host: 0.0.0.0
Port: 8888

# JWT 签发与校验（login 签发、userinfo/aggregate 校验）
Auth:
  AccessSecret: u46ipHAzMD2I4CH4lyz0NxZzEWQ5jQ6n
  AccessExpire: 86400

# Casdoor SaaS 身份认证（微信小程序登录）
# Endpoint 指向 Casdoor 实例；本地开发走 docker-compose 自建 Casdoor (http://casdoor:8000)，
# 生产可换成云 SaaS 地址（如 https://door.casdoor.com）。
Casdoor:
  Endpoint: http://casdoor:8000
  ClientId: mall-client-id
  ClientSecret: mall-client-secret
  Certificate: service/gateway/api/etc/casdoor-cert.pem
  OrganizationName: mall
  ApplicationName: mall-app
  # 真实微信小程序凭据已配置到 Casdoor Provider (admin/provider-wechat-mp)，
  # 走真实 jscode2session 链路；如需本地无网联调再临时置 true
  MockMiniProgram: false

# 下游 RPC 客户端（供 handler/logic 编排聚合）
UserRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: user.rpc

OrderRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: order.rpc

ProductRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: product.rpc

Upstreams:
  # ---- 用户服务（注册走纯转发）----
  - Name: user.rpc
    Grpc:
      Etcd:
        Hosts:
          - etcd:2379
        Key: user.rpc
    ProtoSets:
      - service/gateway/api/etc/protosets/user.pb
    Mappings:
      - Method: post
        Path: /api/user/register
        RpcPath: user.User/Register

  # ---- 订单服务（增删改查走纯转发）----
  - Name: order.rpc
    Grpc:
      Etcd:
        Hosts:
          - etcd:2379
        Key: order.rpc
    ProtoSets:
      - service/gateway/api/etc/protosets/order.pb
    Mappings:
      - Method: post
        Path: /api/order/create
        RpcPath: order.Order/Create
      - Method: post
        Path: /api/order/update
        RpcPath: order.Order/Update
      - Method: post
        Path: /api/order/remove
        RpcPath: order.Order/Remove
      - Method: post
        Path: /api/order/detail
        RpcPath: order.Order/Detail
      - Method: post
        Path: /api/order/list
        RpcPath: order.Order/List

  # ---- 商品服务（增删改查走纯转发）----
  - Name: product.rpc
    Grpc:
      Etcd:
        Hosts:
          - etcd:2379
        Key: product.rpc
    ProtoSets:
      - service/gateway/api/etc/protosets/product.pb
    Mappings:
      - Method: post
        Path: /api/product/create
        RpcPath: product.Product/Create
      - Method: post
        Path: /api/product/update
        RpcPath: product.Product/Update
      - Method: post
        Path: /api/product/remove
        RpcPath: product.Product/Remove
      - Method: post
        Path: /api/product/detail
        RpcPath: product.Product/Detail

  # ---- 支付服务（增删改查走纯转发）----
  - Name: pay.rpc
    Grpc:
      Etcd:
        Hosts:
          - etcd:2379
        Key: pay.rpc
    ProtoSets:
      - service/gateway/api/etc/protosets/pay.pb
    Mappings:
      - Method: post
        Path: /api/pay/create
        RpcPath: pay.Pay/Create
      - Method: post
        Path: /api/pay/detail
        RpcPath: pay.Pay/Detail
      - Method: post
        Path: /api/pay/callback
        RpcPath: pay.Pay/Callback

# Telemetry for distributed tracing
Telemetry:
  Name: gateway
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

# Prometheus metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9088
  Path: /metrics

# Logging
Log:
  ServiceName: gateway
  Mode: file
  Encoding: json
  Path: /var/log/golang
  Level: info
  TimeFormat: "2006-01-02T15:04:05.000Z07:00"

Name: user.rpc
ListenOn: 0.0.0.0:9000
Mode: dev
Log:
  ServiceName: rpc.rpc
  Mode: file
  Encoding: json
  Path: /var/log/golang
  Level: info
  TimeFormat: "2006-01-02T15:04:05.000Z07:00"


Etcd:
  Hosts:
    - etcd:2379
  Key: user.rpc

Mysql:
  DataSource: root:****@tcp(mysql:3306)/mall?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

CacheRedis:
  - Host: redis:6379
    Type: node

Salt: HWVOFkGgPTryzICwd7qnJaZR9KQ2i8xe
Telemetry:
  Name: user.rpc
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics
syntax = "proto3";

package user;

option go_package = "./user";

// 用户登录
message LoginRequest {
  string Mobile = 1;
  string Password = 2;
}
message LoginResponse {
  int64 Id = 1;
  string Name = 2;
  int64 Gender = 3;
  string Mobile = 4;
}
// 用户登录

// 用户注册
message RegisterRequest {
  string Name = 1;
  int64 Gender = 2;
  string Mobile = 3;
  string Password = 4;
}
message RegisterResponse {
  int64 Id = 1;
  string Name = 2;
  int64 Gender = 3;
  string Mobile = 4;
}
// 用户注册

// 用户信息
message UserInfoRequest {
  int64 Id = 1;
}
message UserInfoResponse {
  int64 Id = 1;
  string Name = 2;
  int64 Gender = 3;
  string Mobile = 4;
}
// 用户信息

// 通过 Casdoor 登录（微信小程序等第三方登录落地到本地用户）
message LoginByCasdoorRequest {
  // 商户 Id（租户隔离的关联维度）
  int64 MerchantId = 1;
  // Casdoor 用户 Id（关联键，稳定唯一）
  string CasdoorId = 2;
  // Casdoor 用户名（如 wechat-{openid}，仅展示/兼容旧数据）
  string CasdoorName = 3;
  // 真实手机号（微信 getPhoneNumber 换取），可能为空
  string Mobile = 4;
}
message LoginByCasdoorResponse {
  int64 Id = 1;
  string Name = 2;
  int64 Gender = 3;
  string Mobile = 4;
  // Casdoor 用户 Id（关联键）
  string CasdoorId = 5;
  // Casdoor 用户名（展示用）
  string CasdoorName = 6;
  // 所属商户
  int64 MerchantId = 7;
}

// 商户配置（SaaS：每商户自己的 Casdoor 应用 + 微信小程序凭据）
message GetMerchantRequest {
  int64 Id = 1;
}
message GetMerchantResponse {
  int64 Id = 1;
  string Name = 2;
  int64 Status = 3;
  // Casdoor 租户段（openid 链路）
  string CasdoorEndpoint   = 4;
  string CasdoorClientId   = 5;
  string CasdoorOrg        = 6;
  string CasdoorApp        = 7;
  string CasdoorCertPem    = 8;
  // 微信小程序段（手机号链路；secret 已解密为明文返回）
  string WxAppId           = 9;
  string WxAppSecret       = 10;
}

service User {
  rpc Login(LoginRequest) returns(LoginResponse);
  rpc Register(RegisterRequest) returns(RegisterResponse);
  rpc UserInfo(UserInfoRequest) returns(UserInfoResponse);
  rpc LoginByCasdoor(LoginByCasdoorRequest) returns(LoginByCasdoorResponse);
  rpc GetMerchant(GetMerchantRequest) returns(GetMerchantResponse);
}
